<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-label="invitehook — useInviteHook() coming soon">
  <title>invitehook — useInviteHook() coming soon</title>

  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="55%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="hook" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
  </defs>

  <style>
    .wordmark {
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
      font-size: 68px; font-weight: 800; letter-spacing: -2.4px;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 22px; letter-spacing: 0.4px;
    }
    .pill {
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
      font-size: 14px; font-weight: 600; letter-spacing: 4.2px;
    }
    .muted { fill: #8b93a7; }
    .hairline { stroke: #8b93a7; }
  </style>

  <!-- hook mark -->
  <g transform="translate(-318 8)">
    <g fill="none" stroke="url(#hook)" stroke-width="15" stroke-linecap="round">
      <path d="M500 76 L500 148 C500 196 458 196 458 196 C416 196 416 148 416 148 L416 132"/>
    </g>
    <circle cx="500" cy="52" r="11" fill="url(#hook)">
      <animate attributeName="r" values="11;13.5;11" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.55;1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- lockup -->
  <text class="wordmark" x="232" y="120" fill="url(#brand)">invitehook</text>
  <text class="mono muted" x="236" y="158">useInviteHook()</text>

  <g transform="translate(236 192)">
    <rect class="hairline" x="0" y="0" width="196" height="34" rx="17" fill="none" stroke-opacity="0.45"/>
    <text class="pill muted" x="100" y="22" text-anchor="middle">COMING SOON</text>
  </g>
</svg>
